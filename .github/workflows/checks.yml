name: Checks

# Every pull request, whatever branch it targets, and every push to the two
# long-lived branches. The same commands a contributor runs locally
# (CLAUDE.md, Operational Discipline), plus the tests.
on:
  pull_request:
  push:
    branches: [main, staging]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Built against a stub, never a real Supabase project. The browser tests
      # answer every request to this host themselves (tests/e2e/stub-backend.ts)
      # and block any that would reach supabase.co. No secrets are needed, and
      # none are given.
      NEXT_PUBLIC_SUPABASE_URL: http://supabase.test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-test-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # LayoutProps, PageProps and the route types are generated by Next.js
      # into .next/types, which a fresh checkout does not have yet. Without
      # this, the typecheck below fails before the build would have made them.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
